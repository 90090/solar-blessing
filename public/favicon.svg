<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#2b4b21"/>

  <!-- Sun rays -->
  <g stroke="#f9af39" stroke-width="2.5" stroke-linecap="round">
    <line x1="32" y1="8"  x2="32" y2="14"/>
    <line x1="32" y1="50" x2="32" y2="56"/>
    <line x1="8"  y1="32" x2="14" y2="32"/>
    <line x1="50" y1="32" x2="56" y2="32"/>
    <line x1="14.7" y1="14.7" x2="19" y2="19"/>
    <line x1="45"   y1="45"   x2="49.3" y2="49.3"/>
    <line x1="49.3" y1="14.7" x2="45"   y2="19"/>
    <line x1="19"   y1="45"   x2="14.7" y2="49.3"/>
  </g>

  <!-- Sun core -->
  <circle cx="32" cy="32" r="10" fill="#f9af39"/>

  <!-- Inner highlight -->
  <circle cx="29" cy="29" r="3" fill="#fbd07a" opacity="0.6"/>
</svg>
